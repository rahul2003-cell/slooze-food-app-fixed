spring.application.name=slooze-foodapp

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/slooze_food_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Rahul@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=slooze_super_secret_key_2024_make_it_long_enough_for_hs256_algorithm
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000

# Server
server.port=8080

# Disable open-in-view to avoid lazy loading issues during serialization
spring.jpa.open-in-view=false
